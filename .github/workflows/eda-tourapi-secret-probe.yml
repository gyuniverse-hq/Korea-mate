name: EDA TourAPI credential and data probe

# One-shot audit on the research branch. No default-branch changes.
# Future runs can be rerun from this workflow's GitHub Actions page.
on:
  push:
    branches:
      - research/eda-2025-survey
    paths:
      - .github/workflows/eda-tourapi-secret-probe.yml

permissions:
  contents: read

concurrency:
  group: eda-tourapi-secret-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TOURAPI_SERVICE_KEY: ${{ secrets.TOURAPI_SERVICE_KEY }}
    steps:
      - name: Validate TourAPI via secret (aggregates only)
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from collections import Counter
          from datetime import date, timedelta, datetime, timezone
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          def publish(result):
              # Never log the key, full URL, raw rows, headers or response body.
              print("EDA_TOURAPI_PROBE_JSON=" + json.dumps(result, ensure_ascii=False, sort_keys=True))
              path = os.environ.get("GITHUB_STEP_SUMMARY")
              if path:
                  with open(path, "a", encoding="utf-8") as out:
                      out.write("## Korea Mate · TourAPI live probe\n\n")
                      out.write(f"**State:** {result.get('status', 'unknown')}\n\n")
                      out.write(f"**Sample size:** {result.get('rows', 0)}\n\n")
                      out.write(f"**HTTP code:** {result.get('http_code', 'n/a')}\n\n")
                      if "field_coverage_pct" in result:
                          out.write("| Field | Coverage |\n|---|---:|\n")
                          for field, coverage in result["field_coverage_pct"].items():
                              out.write(f"| {field} | {coverage}% |\n")
                      out.write("\nNo keys, original source rows, or personal data were included.\n")

          key = os.environ.get("TOURAPI_SERVICE_KEY", "").strip()
          if not key:
              publish({"status": "blocked", "reason": "secret_not_available"})
              sys.exit(2)

          today = date.today()
          start_date = (today - timedelta(days=90)).strftime("%Y%m%d")
          params = urlencode({
              "serviceKey": key,
              "MobileOS": "ETC",
              "MobileApp": "KoreaMate",
              "_type": "json",
              "eventStartDate": start_date,
              "numOfRows": "100",
              "pageNo": "1",
          })
          endpoint = "https://apis.data.go.kr/B551011/KorService2/searchFestival2"
          request = Request(endpoint + "?" + params, headers={"User-Agent": "KoreaMate-EDA-QualityProbe/1.0"})
          try:
              with urlopen(request, timeout=25) as response:
                  http_code = response.status
                  raw = response.read(2_000_000)
          except HTTPError as err:
              publish({"status": "http_error", "http_code": err.code})
              sys.exit(1)
          except (URLError, TimeoutError, OSError) as err:
              publish({"status": "network_error", "exception_type": type(err).__name__})
              sys.exit(1)

          try:
              data = json.loads(raw)
          except (ValueError, UnicodeDecodeError):
              publish({"status": "non_json", "http_code": http_code})
              sys.exit(1)
          if not isinstance(data, dict):
              publish({"status": "unexpected_response", "http_code": http_code})
              sys.exit(1)

          envelope = data.get("response", {})
          header = envelope.get("header", {}) if isinstance(envelope, dict) else {}
          result_code = str(header.get("resultCode", "missing"))
          if result_code not in {"0000", "0"}:
              # Only share status code, not the upstream message that may echo request details.
              publish({"status": "provider_error", "http_code": http_code, "provider_code": result_code[:32]})
              sys.exit(1)

          body = envelope.get("body", {})
          if not isinstance(body, dict):
              publish({"status": "invalid_body", "http_code": http_code})
              sys.exit(1)
          records = body.get("items", {})
          records = records.get("item", []) if isinstance(records, dict) else records
          if records is None:
              records = []
          if isinstance(records, dict):
              records = [records]
          if not isinstance(records, list):
              publish({"status": "invalid_items", "http_code": http_code})
              sys.exit(1)
          records = [r for r in records if isinstance(r, dict)]

          def exists(value):
              return value is not None and str(value).strip() not in {"", "None", "null"}

          fields = ("contentid", "title", "addr1", "areacode",
                    "mapx", "mapy", "eventstartdate", "eventenddate", "modifiedtime")
          coverage = {f: round(100 * sum(exists(r.get(f)) for r in records) / len(records), 1)
                      for f in fields} if records else {}
          ids = [str(r["contentid"]) for r in records if exists(r.get("contentid"))]
          duplicated = sum(count - 1 for count in Counter(ids).values() if count > 1)

          valid_coords = 0
          swapped_coords = 0
          invalid_dates = 0
          expired_dates = 0
          for row in records:
              try:
                  x, y = float(row["mapx"]), float(row["mapy"])
                  valid_coords += bool(124 <= x <= 133 and 32 <= y <= 39.5)
                  swapped_coords += bool(124 <= y <= 133 and 32 <= x <= 39.5)
              except (KeyError, TypeError, ValueError, OverflowError):
                  pass
              try:
                  begin = datetime.strptime(str(row["eventstartdate"]), "%Y%m%d").date()
                  end = datetime.strptime(str(row["eventenddate"]), "%Y%m%d").date()
                  if end < begin:
                      invalid_dates += 1
                  elif end < today:
                      expired_dates += 1
              except (KeyError, TypeError, ValueError):
                  invalid_dates += 1

          result = {
              "status": "success" if records else "no_rows",
              "http_code": http_code,
              "checked_at_utc": datetime.now(timezone.utc).isoformat(timespec="seconds"),
              "event_start_filter": start_date,
              "rows": len(records),
              "provider_total_count": body.get("totalCount", None),
              "field_coverage_pct": coverage,
              "valid_korean_coordinates": valid_coords,
              "suspected_swapped_coordinates": swapped_coords,
              "invalid_event_date_ranges": invalid_dates,
              "published_dates_expired": expired_dates,
              "duplicate_content_ids": duplicated,
              "live_open_or_bookable_confirmed": False,
              "scope": "first API page only; not a representative sample",
          }
          publish(result)
          sys.exit(0 if records else 1)
          PY
